plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


// Cấu hình mạng: chỉ cho phép HTTP (không mã hoá) tới máy chủ API trong file .env ở thư mục gốc
// (không commit) và các địa chỉ phát triển. File XML được SINH lúc build nên IP máy chủ
// không nằm trong mã nguồn.
def envFile = rootProject.file('../.env')
def apiHost = null
if (envFile.exists()) {
    envFile.eachLine('UTF-8') { line ->
        def t = line.trim()
        if (t.startsWith('API_BASE_URL=')) {
            def url = t.substring('API_BASE_URL='.length()).trim()
            if (url.startsWith('http://')) apiHost = new URI(url).host
        }
    }
}
def netSecDir = file("${buildDir}/generated/res/netsec")
def cleartextHosts = ['127.0.0.1', 'localhost', '10.0.2.2'] + (apiHost ? [apiHost] : [])
def netSecXml = file("${netSecDir}/xml/network_security_config.xml")
netSecXml.parentFile.mkdirs()
def domainLines = cleartextHosts.collect { "        <domain includeSubdomains=\"false\">${it}</domain>" }
netSecXml.setText(([
    '<?xml version="1.0" encoding="utf-8"?>',
    '<!-- FILE SINH TU DONG tu .env luc build - khong sua tay -->',
    '<network-security-config>',
    '    <base-config cleartextTrafficPermitted="false" />',
    '    <domain-config cleartextTrafficPermitted="true">',
] + domainLines + [
    '    </domain-config>',
    '</network-security-config>',
]).join(System.lineSeparator()), 'UTF-8')

android {
    namespace "com.example.rubikSolver"
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.res.srcDirs += netSecDir
    }

    lintOptions {
        disable 'InvalidPackage'
    }


    defaultConfig {
        applicationId "com.example.rubikSolver"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

flutter {
    source '../..'
}

tasks.matching { it.name.contains("AarMetadata") }.configureEach {
    enabled = false
}

